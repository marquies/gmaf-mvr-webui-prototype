name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watchAll=false --runInBand --json --outputFile="$RUNNER_TEMP/cra-tests.json"
        env:
          CI: 'true'
      - run: npm run test:standalone -- --json --outputFile="$RUNNER_TEMP/standalone-tests.json"
      - run: node scripts/compare-jest-reports.cjs "$RUNNER_TEMP/cra-tests.json" "$RUNNER_TEMP/standalone-tests.json"
      - run: npm run build
        env:
          # GitHub defaults CI=true; retain existing CRA warnings without failing the build.
          CI: 'false'
